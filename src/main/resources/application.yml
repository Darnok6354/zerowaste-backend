spring:
  application:
    name: zerowaste-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/zerowaste_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://mpkuposrgoodxvqrticj.supabase.co:/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256



  sql:
    init:
      mode: never

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html


spoonacular:
  api:
    url: https://api.spoonacular.com
    key: ${SPOONACULAR_API_KEY}
